%YAML:1.0

appName: CTR
description: Control module
priority: 0    #{0 ... 12} not currently used
scheduleFrequency: 30
isDetermineSchedule: false    #{true, false}
logFile: /opt/app/pnc/log    #logPath, Does not support dynamic modification
logMode: 0    #{0, 1, 2, 3, 4, 5, 6}, 0: 固定文件存储，异步日志 1: 打屏，同步日志，适合调试， 2: 指定文件存储,同步日志，适合调试，
              #3：固定+打屏， 4：固定+指定， 5：打屏+指定， 6：固定+打屏+指定
logLevel: 6    #{0，1，2，3，4，5，6}，0：verbose, 1：debug, 2：info, 3：warn, 4：error, 5：fatal, 6：off
recvInstanceID:
    bodyReportInstanceID : 1
    chassisReportInstanceID : 1
    egoTrajectoryInstanceID : 103
    locationInstanceID : 113
    vehicleRepInstanceID : 8800
sendInstanceID:
    bodyCmdInstanceID : 1
    chassisCmdInstanceID : 1
    controlInstanceID : 8805
    controlDebugInstanceID : 9200
    controlDebugFlag : false #  true:controlDebug
