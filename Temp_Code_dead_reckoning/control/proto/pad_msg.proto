syntax = "proto2";
package TL.control;

import "proto/common/header.proto";
import "proto/soc/chassis.proto";

enum DrivingAction {
  STOP = 0;
  START = 1;
  RESET = 2;
};

message PadMessage {
  // control mode, set mode according to low level definition
  optional TL.common.Header header = 1;

  // send driving mode to drive
  optional TL.soc.Chassis.DrivingMode driving_mode = 2;

  // action in the driving_mode
  optional DrivingAction action = 3;
}
