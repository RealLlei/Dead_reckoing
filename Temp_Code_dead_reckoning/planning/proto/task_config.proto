  }
  
  message LaneContinueJointStageConfig {
    optional bool completely_ignore_back_obs = 1 [default = false];
  }
  
  message ReverseGearJointStageConfig {
  }
  
  message JointStageConfig {
    enum JointStageType {
      LANE_KEEP_JOINT_STAGE = 0;
      LANE_CHANGE_ONGOING_JOINT_STAGE = 1;
      LANE_CHANGE_PREFINISH_JOINT_STAGE = 2;
      LANE_MERGE_CRUISE_JOINT_STAGE = 3;
      LANE_MERGE_STOP_JOINT_STAGE = 4;
      LANE_CONTINUE_JOINT_STAGE = 5;
      REVERSE_GEAR_JOINT_STAGE = 6;
    }
  
    optional JointStageType joint_stage_type = 1;
    optional JointStageType next_joint_stage_type = 2;
    oneof joint_stage_config {
      LaneKeepJointStageConfig lane_keep_joint_stage_config = 4;
      LaneChangeOngoingJointStageConfig lane_change_ongoing_joint_stage_config = 5;
      LaneChangePrefinishJointStageConfig lane_change_prefinish_joint_stage_config = 6;
      LaneMergeCruiseJointStageConfig lane_merge_cruise_joint_stage_config = 7;
      LaneMergeStopJointStageConfig lane_merge_stop_joint_stage_config = 8;
      LaneContinueJointStageConfig lane_continue_joint_stage_config = 9;
      ReverseGearJointStageConfig reverse_gear_joint_stage_config = 10;
    }
  }
  
  message LaneKeepJointScenarioConfig {
  }
  
  message LaneChangeJointScenarioConfig {
  }
  
  message LaneMergeJointScenarioConfig {
  }
  
  message LaneContinueJointScenarioConfig {
  }
  
  message ReverseGearJointScenarioConfig {
  }
  message StopConfig{
    message StopAverageAccelThresholdCalibrationInfo {
      optional double speed = 1 [default = 0.0];
      optional double accel = 2 [default = 0.25];
    }
    // consider static obstacle go backward in stop case
    optional double stop_distance_backward_coef = 1 [default = 1.0];

    // if speed is less then stop_prefinish_distance_threshold, adc will reuse last frame stop curve
    optional double stop_prefinish_distance_threshold = 2 [default = 5.0];
    // if average accel of stop curve is greate than average_accel_threshold,
    // stop curve is not good
    repeated StopAverageAccelThresholdCalibrationInfo stop_average_accel_threshold_calibration_info = 3;
    // max_negetive_expected_stop_distance_error < (real_stop_distance - expected_stop_distance) &&
    // (real_stop_distance - expected_stop_distance) < max_positive_expected_stop_distance_error
    optional double max_stop_distance = 4 [default = 1.5];
    optional double min_stop_distance = 5 [default = 2.0];
    optional double adc_start_distance_threshold_after_stop = 6 [default = 5.0];
    optional double stop_curve_end_speed = 7 [default = 0.3];
    optional double stop_curve_end_accel = 8 [default = -0.3];
  }
  
  message JointScenarioConfig {
    enum JointScenarioType {
      LANE_KEEP_JOINT_SCENARIO = 1;
      LANE_CHANGE_JOINT_SCENARIO = 2;
      LANE_MERGE_JOINT_SCENARIO = 3;
      LANE_CONTINUE_JOINT_SCENARIO = 4;
      REVERSE_GEAR_JOINT_SCENARIO = 5;
    }
  
    message AccelLimitCalibrationInfo {
      optional double speed = 1 [default = 0.0];
      optional double accel = 2 [default = 0.0];
    }
  
    message DecelLimitCalibrationInfo {
      optional double speed = 1 [default = 0.0];
      optional double decel = 2 [default = 0.0];
    }
  
    message JerkLimitCalibrationInfo {
      optional double speed = 1 [default = 0.0];
      optional double jerk = 2 [default = 0.0];
    }
  
    optional JointScenarioType joint_scenario_type = 1;
    repeated JointStageConfig joint_stage_config = 2;
    oneof joint_scenario_config {
      LaneKeepJointScenarioConfig lane_keep_joint_scenario_config = 3;
      LaneChangeJointScenarioConfig lane_change_joint_scenario_config = 4;
      LaneMergeJointScenarioConfig lane_merge_joint_scenario_config = 5;
      LaneContinueJointScenarioConfig lane_continue_joint_scenario_config = 6;
      ReverseGearJointScenarioConfig reverse_gear_joint_scenario_config = 7;
    }
  
    // select follow_time to nudge parallel car in follow case
    repeated double follow_time = 8;
    optional double standstill_accel = 9 [default = -0.3];
    // after adc has already finish stop, if static obstacle distance change does not exceed this value,
    // adc will keep standstill
    repeated AccelLimitCalibrationInfo accel_limit_calibration_info = 11;
    repeated DecelLimitCalibrationInfo decel_limit_calibration_info = 12;
    repeated JerkLimitCalibrationInfo jerk_limit_calibration_info = 13;
    optional StopConfig stop_config = 14;
  }

  message JointScenarioManagerConfig {
    repeated JointScenarioConfig joint_scenario_config = 1;
    optional double ramp_acceleration_distance = 2 [default = 105.0];
    optional double ramp_acceleration_speed = 3 [default = 19.45];
    optional double lane_merge_start_distance = 4 [default = 250.0];
    optional double lane_continue_start_distance = 5 [default = 200.0];
  }
  
  message SpeedScenarioManagerConfig {
    repeated SpeedScenarioConfig speed_scenario_config = 1;
    optional double ramp_acceleration_distance = 2 [default = 105.0];
    optional double ramp_acceleration_speed = 3 [default = 19.45];
    optional double lane_merge_start_distance = 4 [default = 250.0];
    optional double lane_continue_start_distance = 5 [default = 200.0];
  }

  message LimitManagerConfig {
    message SpeedLimitConfig {
      message ConeNudgeSpeedLimit {
        repeated double speed = 1;
        repeated double l_distance = 2;
      }
      optional double dece_when_exceed_cruise_speed = 1 [default = -0.5];
      optional double jerk_when_exceed_cruise_speed = 2 [default = -0.5];

      optional double dece_when_exceed_map_speed_limit = 3 [default = -0.5];
      optional double jerk_when_exceed_map_speed_limit = 4 [default = -0.5];

      optional double dece_when_exceed_pedestrian_speed_limit = 5 [default = -0.9];
      optional double jerk_when_exceed_pedestrian_speed_limit = 6 [default = -0.8];

      optional double dece_when_exceed_camera_speed_limit = 7 [default = -0.7];
      optional double jerk_when_exceed_camera_speed_limit = 8 [default = -0.5];

      optional double dece_when_exceed_cone_speed_limit = 9 [default = -1.5];
      optional double jerk_when_exceed_cone_speed_limit = 10 [default = -0.8];

      optional double max_preview_ramp_distance = 11 [default = 500.0];
      optional double dece_when_exceed_ramp_speed_limit = 12 [default = -1.0];
      optional double jerk_when_exceed_ramp_speed_limit = 13 [default = -0.5];
      optional double speed_limit_point_distance_to_ramp = 14 [default = 0.0];

      optional double max_preview_tunnel_distance = 15 [default = 500.0];
      optional double dece_when_exceed_tunnel_speed_limit = 16 [default = -0.8];
      optional double jerk_when_exceed_tunnel_speed_limit = 17 [default = -0.5];
      optional double speed_limit_point_distance_to_tunnel = 18 [default = 200.0];

      optional double dece_when_exceed_tollhouse_speed_limit = 66 [default = -1.0];
      optional double jerk_when_exceed_tollhouse_speed_limit = 67 [default = -0.5];
      optional double speed_limit_point_distance_to_tollhouse = 68 [default = 50.0];
      optional int32  tollhouse_speed_limit_km = 69 [default = 60];

      optional ConeNudgeSpeedLimit cone_nudge_speed_limit = 70;
    }

    message SteeringWheelLimitConfig {
      message SteeringWheelAngleLimit {
        repeated double speed = 1;
        repeated double steering_wheel_angle = 2;
      }

      message SteeringWheelAngleSpeedLimit{
        repeated double speed = 1;
        repeated double steering_wheel_angle_speed = 2;
      }

      optional SteeringWheelAngleLimit steering_wheel_angle_limit = 1;
      optional SteeringWheelAngleSpeedLimit steering_wheel_angle_speed_limit = 2;
    }

    optional SpeedLimitConfig speed_limit_config = 1;
    optional SteeringWheelLimitConfig steering_wheel_limit_config = 2;
  }

  message ConstraintManagerConfig {
    enum ConstraintMode {
      CONE_CONSTRAINT = 0;
      INDICATOR_CONSTRAINT = 1;
    }

    message StateConstraintConfig {
    }

    message ControlConstraintConfig {
    }

    message BoundCollisionConstraintConfig {
      optional double safety_distance = 1 [default = 0.0];
    }

    message ObstacleCollisionConstraintConfig {
      optional double longi_safety_dis = 1 [default = 0.0];
      optional double lati_safety_dis = 2 [default = 0.0];
    }

    optional double penalty = 1 [default = 1.0];
    optional double penalty_scaling = 2 [default = 6.0];
    optional StateConstraintConfig state_constraint_config = 3;
    optional ControlConstraintConfig control_constraint_config = 4;
    optional BoundCollisionConstraintConfig bound_collision_constraint_config = 5;
    optional ObstacleCollisionConstraintConfig obstacle_collision_constraint_config = 6;
    optional ConstraintMode constraint_mode = 7 [default = INDICATOR_CONSTRAINT];
  }

  message CostManagerConfig {
    message StateControlCostConfig {
      optional double init_distance_weight = 1 [default = 0.1];
      optional double reference_distance_weight = 2 [default = 0.1];
      optional double init_theta_weight = 3 [default = 0.0];
      optional double reference_theta_weight = 4 [default = 0.0];
      optional double init_speed_weight = 5 [default = 0.1];
      optional double reference_speed_weight = 6 [default = 0.1];
      optional double kappa_weight = 7 [default = 0.02];
      optional double lon_acc_weight = 8 [default = 0.1];
      optional double lat_acc_weight = 9 [default = 0.005];
      optional double end_dist = 10 [default = 0.0];
      optional double lat_jerk_weight = 11 [default = 0.005];
      optional double dkappa_weight = 12 [default = 0.001];
      optional double jerk_weight = 13 [default = 0.1];
    }

    message LastStateControlCostConfig {
      optional double penalized_last_t = 1 [default = 1.0];
      optional double last_distance_weight = 2 [default = 0.1];
      optional double last_theta_weight = 3 [default = 0.1];
      optional double last_speed_weight = 4 [default = 0.2];
      optional double last_omega_weight = 5 [default = 0.01];
      optional double last_lon_acc_weight = 6 [default = 0.2];
      optional double last_omega_rate_weight = 7 [default = 0.01];
      optional double last_jerk_weight = 8 [default = 0.01];
    }

    message BoundTTCCostConfig {
      optional double ttc_threshold = 1 [default = 1.25];
      optional double weight = 2 [default = 0.01];
      optional double bound_sim_time = 3 [default = 1.2];
    }
  
    message ObstacleTTCCostConfig {
      optional double ttc_threshold = 1 [default = 0.8];
      optional double weight = 2 [default = 0.001];
    }

    optional StateControlCostConfig state_control_cost_config = 1;
    optional LastStateControlCostConfig last_state_control_cost_config = 2;
    optional BoundTTCCostConfig bound_ttc_cost_config = 3;
    optional ObstacleTTCCostConfig obstacle_ttc_cost_config = 4;
  }

  message IlqrSolverConfig {
    optional bool verbose = 1 [default = false];
    optional int32 max_line_search_ite = 2 [default = 10];
    optional double line_search_init_step = 3 [default = 1.0];
    optional double line_search_step_decay = 4 [default = 0.5];
    optional double rho = 5 [default = 0.0];
    optional double max_reg = 6 [default = 1.0e8];
    optional double min_reg = 7 [default = 1.0e-8];
    optional double reg_scale = 8 [default = 1.5];
    optional int32 max_iteration_count = 9 [default = 10];
    optional double intermediate_obj_tol = 11 [default = 0.001];
    optional double violation_tol = 12 [default = 0.01];
    optional bool use_multu_thread = 15 [default = true];
    optional int32 thread_count = 16 [default = 4];
  }

  message CilqrSolverConfig {
    optional bool verbose = 1 [default = false];
    optional int32 max_iteration_count = 2 [default = 10];
    optional IlqrSolverConfig ilqr_solver_config = 3;
  }

  message IDMParam {
    optional double desire_velocity = 1;
    optional double min_spacing = 2;
    optional double time_headway = 3;
    optional double max_acc = 4;
    optional double desired_deacc = 5;
    optional double min_dacc = 6;
    optional double max_jerk = 7;
    optional double delta = 8;
  }

  enum RoughSolutionType {
    FROM_SELF = 0;
    FROM_PREDICTION = 1;
  }
  
  optional bool debug_print = 1 [default = false];
  optional bool enable_reuse = 2 [default = false];
  optional double dense_interval_t = 3 [default = 0.1];
  optional int32 dense_count = 4 [default = 10];
  optional double sparse_interval_t = 5 [default = 0.2];
  optional double total_time = 6 [default = 7.0];
  optional JointScenarioManagerConfig joint_scenario_manager_config = 7;
  optional LimitManagerConfig limit_manager_config = 8;
  optional ConstraintManagerConfig constraint_manager_config = 9;
  optional CostManagerConfig cost_manager_config = 10;
  optional CilqrSolverConfig cilqr_solver_config = 11;
  optional RoughSolutionType rough_solution_type = 12 [default = FROM_SELF];
}

message JointOptimizerDebugInfo {
  
}

message JointPostDeciderConfig {
  message SteerWheelAngleSegment {
   repeated double vehicle_speed = 1;
   repeated double steering_wheel_angle_limit = 2;
   repeated double steering_wheel_speed_limit_segment = 3;
  }
  optional double fallback_accel_threshold = 1 [default = 4.0];
  optional double fallback_decel_threshold = 2 [default = -4.0];
  enum IsFallBackType {
    IS_FALL_BACK_ST = 0;
    IS_FALL_BACK_TTC = 1;
  }
  optional IsFallBackType is_fall_back_type = 3 [default = IS_FALL_BACK_TTC];
  optional SteerWheelAngleSegment steer_wheel_speed_segment = 4;
  
}
