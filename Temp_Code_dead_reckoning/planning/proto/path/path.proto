syntax = "proto2";
package TL.PathInfo;

message Point {
    optional double x = 1;
    optional double y = 2;
    optional double theta = 3;
}

message PathMetric{
    optional string name = 1;
    optional bool suc = 2 [default = false];
    repeated Point path_point = 3;
    repeated uint32 shift_idxs = 4; // save each gear last idx
    optional uint32 seg_num = 100;
    optional double cloest_dis_to_obs = 101;
    optional double shortest_seg_length = 102; // m
    optional double time_cost = 200;    // ms
}

message Obstacle {
    optional Point seg_start = 1;
    optional Point seg_end = 2;
    optional bool is_virtual = 3 [default = false];
    optional double safety_margin = 10 [default = 0.15];
}

enum Scene {
    UNKOWN = 0;
    VERTICAL = 1;
    OBLIQUE = 2;
    LATERAL = 3;
}

message EnvInfo{
    optional string name = 1;
    optional Point start = 2;
    optional Point goal = 3;
    optional Scene scene = 4;
    repeated Point path_point = 10;
    repeated Obstacle obs = 20;
    optional string replan_reason = 999;
}